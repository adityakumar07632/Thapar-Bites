<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thapar Bites Ops — Restaurant and Admin dashboard for Thapar Bites. A modern campus food ordering platform built exclusively for the Thapar Institute of Engineering & Technology community." />
    <meta name="theme-color" content="#111827" />
    <meta property="og:title" content="Thapar Bites Ops" />
    <meta property="og:description" content="Restaurant and Admin dashboard for Thapar Bites." />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>Thapar Bites Ops</title>
    <!--
      Anti-flash theme script.
      Runs synchronously before React hydrates so the correct dark/light class
      is already on <html> — prevents a flash of the wrong theme on load.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('cb-theme') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (stored === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
